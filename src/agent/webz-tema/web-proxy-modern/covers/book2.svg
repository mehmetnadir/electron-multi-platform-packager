<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="rgba(255,255,255,0.15)"/>
    </pattern>
    <filter id="softShadow"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="300" height="400" fill="url(#g)"/>
  <rect width="300" height="400" fill="url(#dots)"/>
  <circle cx="270" cy="60" r="60" fill="rgba(255,255,255,0.15)"/>
  <circle cx="40" cy="340" r="80" fill="rgba(255,255,255,0.1)"/>

  <text x="150" y="230" font-size="96" text-anchor="middle" filter="url(#softShadow)">✏️</text>
</svg>